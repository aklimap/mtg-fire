name: mtg-watch
"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: mtg-watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Lancer la surveillance MTG
        env:
          EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
          EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
        run: python mtg_watch.py
      - name: Sauvegarder feux_mtg.json dans le depot
        run: |
          git config user.name  "mtg-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feux_mtg.json
          if git diff --cached --quiet; then
            echo "Aucun changement a committer."
          else
            git commit -m "maj feux MTG [skip ci]"
            git push
          fi
